name: Release Windows

# This workflow file registers the Windows release workflow on the default
# branch. Select a feature branch when dispatching to run that branch's full
# release workflow. The default-branch bootstrap intentionally has no tag
# trigger and does not build or publish artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the bootstrap workflow
        run: echo "Select a branch containing the full release-windows.yml workflow to build its Windows artifact."
